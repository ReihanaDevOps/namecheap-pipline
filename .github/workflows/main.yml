name: Deploy Website to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Upload website to Namecheap
      - name: Deploy to Namecheap
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.NAMECHEAP_HOST }}
          username: ${{ secrets.NAMECHEAP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_PASSWORD }}
          port: ${{ secrets.NAMECHEAP_PORT }}
          source: "index.html,style.css"
          target: "/home/artofthedevops/public_html"
